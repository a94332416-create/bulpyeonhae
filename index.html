// 공지사항 불러오기
async function loadNotices() {

    const noticeList =
        document.getElementById("noticeList");

    if (!noticeList) return;

    const {
        data: notices,
        error
    } = await supabase
        .from("notices")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(
            "공지사항 불러오기 오류:",
            error
        );

        noticeList.innerHTML =
            "공지사항을 불러오지 못했습니다.";

        return;
    }

    if (!notices || notices.length === 0) {

        noticeList.innerHTML =
            "등록된 공지사항이 없습니다.";

        return;
    }

    noticeList.innerHTML = "";

    notices.forEach(notice => {

        const item =
            document.createElement("div");

        item.className = "notice-item";

        item.innerHTML = `
            <div class="notice-title">
                📢 ${notice.title}
            </div>

            <div class="notice-content">
                ${notice.content}
            </div>

            <div class="notice-date">
                ${new Date(
                    notice.created_at
                ).toLocaleDateString("ko-KR")}
            </div>
        `;

        // 관리자 로그인 상태에서만 수정/삭제 버튼 표시
        if (isAdminLoggedIn) {

            const adminButtons =
                document.createElement("div");

            adminButtons.className =
                "notice-admin-buttons";

            const editButton =
                document.createElement("button");

            editButton.textContent =
                "✏️ 수정";

            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "🗑️ 삭제";

            adminButtons.appendChild(
                editButton
            );

            adminButtons.appendChild(
                deleteButton
            );

            item.appendChild(
                adminButtons
            );

            // 수정
            editButton.addEventListener(
                "click",
                async () => {

                    const newTitle =
                        prompt(
                            "공지 제목을 수정해주세요.",
                            notice.title
                        );

                    if (newTitle === null) {
                        return;
                    }

                    const newContent =
                        prompt(
                            "공지 내용을 수정해주세요.",
                            notice.content
                        );

                    if (newContent === null) {
                        return;
                    }

                    if (
                        !newTitle.trim() ||
                        !newContent.trim()
                    ) {

                        alert(
                            "제목과 내용을 모두 입력해주세요."
                        );

                        return;
                    }

                    const {
                        error
                    } = await supabase
                        .from("notices")
                        .update({
                            title:
                                newTitle.trim(),

                            content:
                                newContent.trim(),

                            updated_at:
                                new Date().toISOString()
                        })
                        .eq(
                            "id",
                            notice.id
                        );

                    if (error) {

                        console.error(
                            "공지 수정 오류:",
                            error
                        );

                        alert(
                            "공지 수정에 실패했습니다."
                        );

                        return;
                    }

                    await loadNotices();

                    alert(
                        "공지사항이 수정되었습니다."
                    );
                }
            );

            // 삭제
            deleteButton.addEventListener(
                "click",
                async () => {

                    const confirmed =
                        confirm(
                            "이 공지사항을 삭제할까요?"
                        );

                    if (!confirmed) {
                        return;
                    }

                    const {
                        error
                    } = await supabase
                        .from("notices")
                        .delete()
                        .eq(
                            "id",
                            notice.id
                        );

                    if (error) {

                        console.error(
                            "공지 삭제 오류:",
                            error
                        );

                        alert(
                            "공지 삭제에 실패했습니다."
                        );

                        return;
                    }

                    await loadNotices();

                    alert(
                        "공지사항이 삭제되었습니다."
                    );
                }
            );
        }

        noticeList.appendChild(item);
    });
}

          Math.ceil(
